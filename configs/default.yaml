paper:
  slug: weperson-generalizable-re-identification-from-synthetic-data-with-single-query
  title: "WePerson: Generalizable Re-Identification From Synthetic Data With Single Query Adaptation"
  doi: "10.1109/TBIOM.2025.3540919"
device: cuda
data:
  root: ../../datasets/market1501
  height: 256
  width: 128
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_erasing: true
  num_workers: 4
model:
  backbone: resnet50
  feat_dim: 2048
  pretrained: true
train:
  epochs: 30
  batch_size: 64
  num_instances: 4
  lr: 0.00035
  lr_drops: [20]
  weight_decay: 0.0005
  margin: 0.3
  label_smoothing: 0.1
  lambda_tri: 1.0
  seed: 42
sqa:
  enabled: true
  lr: 0.0001
  lambd: 0.0051
  aug_n: 8
  steps: 1
  w: 0.7
  alpha: 0.95
eval:
  batch_size: 64
  ranks: [1, 5, 10]
  every: 10
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/predictions
  figure_dir: outputs/figures
